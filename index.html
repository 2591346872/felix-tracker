<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人消费记录系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(to right, #4b6cb7, #182848);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 25px;
            background: #f8f9fa;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #4b6cb7;
            transition: transform 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h3 {
            color: #555;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        
        .card .amount {
            font-size: 2rem;
            font-weight: bold;
            color: #182848;
        }
        
        .card .income { color: #2ecc71; }
        .card .expense { color: #e74c3c; }
        .card .balance { color: #3498db; }
        
        .controls {
            padding: 20px 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: #4b6cb7;
            color: white;
        }
        
        .btn-primary:hover {
            background: #3a5aa0;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #2ecc71;
            color: white;
        }
        
        .btn-success:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }
        
        .btn-warning {
            background: #f39c12;
            color: white;
        }
        
        .btn-warning:hover {
            background: #d68910;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        
        .btn-export {
            background: #9b59b6;
            color: white;
        }
        
        .btn-export:hover {
            background: #8e44ad;
            transform: translateY(-2px);
        }
        
        input, select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #4b6cb7;
            box-shadow: 0 0 0 3px rgba(75, 108, 183, 0.1);
        }
        
        .data-section {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 25px;
        }
        
        @media (min-width: 1200px) {
            .data-section {
                flex-direction: row;
            }
            
            .table-container {
                flex: 1;
            }
            
            .charts-container {
                flex: 1;
            }
        }
        
        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #2d3748;
            border-bottom: 2px solid #e2e8f0;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .income-row {
            background: rgba(46, 204, 113, 0.05);
        }
        
        .expense-row {
            background: rgba(231, 76, 60, 0.05);
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        
        .action-btn {
            padding: 5px 10px;
            font-size: 0.8rem;
        }
        
        .charts-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .chart-box {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
        }
        
        .chart-box h3 {
            margin-bottom: 15px;
            color: #2d3748;
            text-align: center;
        }
        
        .chart-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .chart-btn {
            padding: 8px 15px;
            background: #edf2f7;
            color: #4a5568;
        }
        
        .chart-btn.active {
            background: #4b6cb7;
            color: white;
        }
        
        canvas {
            width: 100% !important;
            height: 300px !important;
        }
        
        .content-input {
            position: relative;
        }
        
        .content-suggestions {
            position: absolute;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: none;
        }
        
        .suggestion-item {
            padding: 10px;
            cursor: pointer;
        }
        
        .suggestion-item:hover {
            background: #f0f5ff;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #718096;
            font-size: 0.9rem;
            border-top: 1px solid #e2e8f0;
            background: #f8f9fa;
        }
        
        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            background: #e8f4fd;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-left: 15px;
        }
        
        .sync-status.synced {
            background: #d4edda;
            color: #155724;
        }
        
        .sync-status.syncing {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-wallet"></i> 个人消费记录系统</h1>
            <p class="subtitle">记录每一笔收支，轻松管理个人财务</p>
        </header>
        
        <div class="summary-cards">
            <div class="card">
                <h3>当前年份总收入</h3>
                <div class="amount income" id="total-income">¥0.00</div>
            </div>
            <div class="card">
                <h3>当前年份总支出</h3>
                <div class="amount expense" id="total-expense">¥0.00</div>
            </div>
            <div class="card">
                <h3>当前结余</h3>
                <div class="amount balance" id="current-balance">¥0.00</div>
            </div>
            <div class="card">
                <h3>数据状态</h3>
                <div class="sync-status" id="sync-status">
                    <i class="fas fa-check-circle"></i> 本地存储
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-primary" onclick="addNewRow()">
                <i class="fas fa-plus"></i> 添加记录
            </button>
            
            <div style="display: flex; gap: 10px;">
                <input type="date" id="date-input" style="width: 150px;">
                <div class="content-input">
                    <input type="text" id="content-input" placeholder="内容" list="content-history" style="width: 200px;">
                    <div class="content-suggestions" id="content-suggestions"></div>
                </div>
                <input type="number" id="amount-input" placeholder="金额" step="0.01" style="width: 120px;">
                <select id="type-input" style="width: 120px;">
                    <option value="income">收入</option>
                    <option value="expense">支出</option>
                </select>
                <button class="btn-success" onclick="addRecord()">
                    <i class="fas fa-check"></i> 确认添加
                </button>
            </div>
            
            <div style="margin-left: auto; display: flex; gap: 10px;">
                <button class="btn-warning" onclick="importExcel()">
                    <i class="fas fa-file-import"></i> 导入Excel
                </button>
                <button class="btn-export" onclick="exportExcel()">
                    <i class="fas fa-file-export"></i> 导出Excel
                </button>
                <button class="btn-danger" onclick="clearAllData()">
                    <i class="fas fa-trash"></i> 清空数据
                </button>
            </div>
        </div>
        
        <div class="data-section">
            <div class="table-container">
                <h3><i class="fas fa-table"></i> 收支明细表</h3>
                <div style="overflow-x: auto;">
                    <table id="records-table">
                        <thead>
                            <tr>
                                <th width="100">日期</th>
                                <th width="200">内容</th>
                                <th width="120">收入</th>
                                <th width="120">支出</th>
                                <th width="150">操作</th>
                            </tr>
                        </thead>
                        <tbody id="records-body">
                            <!-- 数据行将通过JavaScript动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="charts-container">
                <div class="chart-box">
                    <h3><i class="fas fa-chart-bar"></i> 收支趋势图</h3>
                    <div class="chart-controls">
                        <button class="chart-btn active" onclick="changeChartType('year')">年度</button>
                        <button class="chart-btn" onclick="changeChartType('month')">月度</button>
                        <button class="chart-btn" onclick="changeChartType('week')">周度</button>
                    </div>
                    <canvas id="barChart"></canvas>
                </div>
                
                <div class="chart-box">
                    <h3><i class="fas fa-chart-pie"></i> 支出类别分布</h3>
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 个人消费记录系统 | 数据存储在您的浏览器本地，支持多设备同步 | 
                <a href="https://github.com/yourusername/expense-tracker" target="_blank" style="color: #4b6cb7;">
                    <i class="fab fa-github"></i> GitHub项目
                </a>
            </p>
        </footer>
    </div>
    
    <input type="file" id="excel-file" style="display: none;" accept=".xlsx,.xls">
    
    <script>
        // 全局变量
        let records = [];
        let contentHistory = [];
        let currentChartType = 'year';
        let barChart, pieChart;
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            updateSummary();
            renderTable();
            updateCharts();
            setupDateInput();
            setupContentInput();
            
            // 自动保存功能
            setInterval(saveData, 30000); // 每30秒自动保存
        });
        
        // 设置日期输入框默认值为今天
        function setupDateInput() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date-input').value = today;
        }
        
        // 设置内容输入框的历史记录和自动完成
        function setupContentInput() {
            const contentInput = document.getElementById('content-input');
            const suggestionsBox = document.getElementById('content-suggestions');
            
            // 加载历史记录
            if(localStorage.getItem('contentHistory')) {
                contentHistory = JSON.parse(localStorage.getItem('contentHistory'));
            }
            
            contentInput.addEventListener('input', function() {
                const value = this.value.toLowerCase();
                if(value.length === 0) {
                    suggestionsBox.style.display = 'none';
                    return;
                }
                
                const matches = contentHistory.filter(item => 
                    item.toLowerCase().includes(value)
                ).slice(0, 10);
                
                if(matches.length > 0) {
                    suggestionsBox.innerHTML = matches.map(item => 
                        `<div class="suggestion-item" onclick="selectSuggestion('${item}')">${item}</div>`
                    ).join('');
                    suggestionsBox.style.display = 'block';
                } else {
                    suggestionsBox.style.display = 'none';
                }
            });
            
            // 点击页面其他地方隐藏建议框
            document.addEventListener('click', function(e) {
                if(!contentInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                    suggestionsBox.style.display = 'none';
                }
            });
        }
        
        function selectSuggestion(content) {
            document.getElementById('content-input').value = content;
            document.getElementById('content-suggestions').style.display = 'none';
        }
        
        // 加载数据
        function loadData() {
            const saved = localStorage.getItem('expenseRecords');
            if(saved) {
                records = JSON.parse(saved);
            }
            
            // 从GitHub加载数据（如果已配置）
            loadFromGitHub();
        }
        
        // 保存数据到本地存储和GitHub
        function saveData() {
            localStorage.setItem('expenseRecords', JSON.stringify(records));
            
            // 保存内容历史记录
            localStorage.setItem('contentHistory', JSON.stringify(contentHistory));
            
            // 同步到GitHub（如果已配置）
            saveToGitHub();
            
            // 更新同步状态
            updateSyncStatus();
        }
        
        // 更新同步状态显示
        function updateSyncStatus() {
            const statusEl = document.getElementById('sync-status');
            statusEl.innerHTML = '<i class="fas fa-check-circle"></i> 已保存';
            statusEl.className = 'sync-status synced';
            
            setTimeout(() => {
                statusEl.innerHTML = '<i class="fas fa-database"></i> 本地存储';
                statusEl.className = 'sync-status';
            }, 2000);
        }
        
        // 添加新记录
        function addRecord() {
            const date = document.getElementById('date-input').value;
            const content = document.getElementById('content-input').value;
            const amount = parseFloat(document.getElementById('amount-input').value);
            const type = document.getElementById('type-input').value;
            
            if(!date || !content || isNaN(amount) || amount <= 0) {
                alert('请填写完整的有效信息！');
                return;
            }
            
            const record = {
                id: Date.now(),
                date: date,
                content: content,
                amount: amount,
                type: type // 'income' 或 'expense'
            };
            
            records.push(record);
            
            // 添加到内容历史记录（如果不存在）
            if(!contentHistory.includes(content)) {
                contentHistory.push(content);
                if(contentHistory.length > 50) contentHistory.shift(); // 限制历史记录数量
            }
            
            // 清空输入框
            document.getElementById('content-input').value = '';
            document.getElementById('amount-input').value = '';
            
            // 保存并更新界面
            saveData();
            updateSummary();
            renderTable();
            updateCharts();
        }
        
        // 添加空行用于编辑
        function addNewRow() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date-input').value = today;
            document.getElementById('content-input').value = '';
            document.getElementById('amount-input').value = '';
            document.getElementById('content-input').focus();
        }
        
        // 更新汇总信息
        function updateSummary() {
            const currentYear = new Date().getFullYear();
            let totalIncome = 0;
            let totalExpense = 0;
            
            records.forEach(record => {
                const recordYear = new Date(record.date).getFullYear();
                if(recordYear === currentYear) {
                    if(record.type === 'income') {
                        totalIncome += record.amount;
                    } else {
                        totalExpense += record.amount;
                    }
                }
            });
            
            document.getElementById('total-income').textContent = '¥' + totalIncome.toFixed(2);
            document.getElementById('total-expense').textContent = '¥' + totalExpense.toFixed(2);
            document.getElementById('current-balance').textContent = '¥' + (totalIncome - totalExpense).toFixed(2);
        }
        
        // 渲染表格
        function renderTable() {
            const tbody = document.getElementById('records-body');
            tbody.innerHTML = '';
            
            // 按日期排序（最新在前）
            const sortedRecords = [...records].sort((a, b) => 
                new Date(b.date) - new Date(a.date)
            );
            
            sortedRecords.forEach(record => {
                const row = document.createElement('tr');
                row.className = record.type === 'income' ? 'income-row' : 'expense-row';
                
                row.innerHTML = `
                    <td>${record.date}</td>
                    <td>${record.content}</td>
                    <td>${record.type === 'income' ? '¥' + record.amount.toFixed(2) : ''}</td>
                    <td>${record.type === 'expense' ? '¥' + record.amount.toFixed(2) : ''}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn btn-warning" onclick="editRecord(${record.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn btn-danger" onclick="deleteRecord(${record.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        // 编辑记录
        function editRecord(id) {
            const record = records.find(r => r.id === id);
            if(!record) return;
            
            document.getElementById('date-input').value = record.date;
            document.getElementById('content-input').value = record.content;
            document.getElementById('amount-input').value = record.amount;
            document.getElementById('type-input').value = record.type;
            
            // 删除原记录
            deleteRecord(id, false);
            
            // 聚焦到内容输入框
            document.getElementById('content-input').focus();
        }
        
        // 删除记录
        function deleteRecord(id, confirmDelete = true) {
            if(confirmDelete && !confirm('确定要删除这条记录吗？')) {
                return;
            }
            
            const index = records.findIndex(r => r.id === id);
            if(index !== -1) {
                records.splice(index, 1);
                saveData();
                updateSummary();
                renderTable();
                updateCharts();
            }
        }
        
        // 清空所有数据
        function clearAllData() {
            if(confirm('确定要清空所有数据吗？此操作不可撤销！')) {
                records = [];
                saveData();
                updateSummary();
                renderTable();
                updateCharts();
            }
        }
        
        // 导出到Excel
        function exportExcel() {
            if(records.length === 0) {
                alert('没有数据可导出！');
                return;
            }
            
            // 准备数据
            const exportData = records.map(record => ({
                '日期': record.date,
                '内容': record.content,
                '类型': record.type === 'income' ? '收入' : '支出',
                '金额': record.amount,
                '收入': record.type === 'income' ? record.amount : '',
                '支出': record.type === 'expense' ? record.amount : ''
            }));
            
            // 创建工作表
            const ws = XLSX.utils.json_to_sheet(exportData);
            
            // 创建工作簿
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '消费记录');
            
            // 生成Excel文件并下载
            const fileName = `消费记录_${new Date().toISOString().split('T')[0]}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }
        
        // 导入Excel
        function importExcel() {
            document.getElementById('excel-file').click();
        }
        
        // 处理文件选择
        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                
                // 获取第一个工作表
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                
                // 转换为JSON
                const jsonData = XLSX.utils.sheet_to_json(worksheet);
                
                // 处理导入的数据
                let importedCount = 0;
                jsonData.forEach(row => {
                    // 尝试不同的列名
                    const date = row['日期'] || row['date'] || row['Date'];
                    const content = row['内容'] || row['内容'] || row['content'] || row['Content'];
                    const type = row['类型'] || row['type'] || row['Type'];
                    const amount = row['金额'] || row['金额'] || row['amount'] || row['Amount'];
                    
                    if(date && content && type && amount) {
                        const record = {
                            id: Date.now() + Math.random(),
                            date: formatDate(date),
                            content: String(content),
                            amount: parseFloat(amount),
                            type: type.includes('收入') || type === 'income' ? 'income' : 'expense'
                        };
                        
                        records.push(record);
                        importedCount++;
                        
                        // 添加到内容历史记录
                        if(!contentHistory.includes(content)) {
                            contentHistory.push(content);
                        }
                    }
                });
                
                if(importedCount > 0) {
                    saveData();
                    updateSummary();
                    renderTable();
                    updateCharts();
                    alert(`成功导入 ${importedCount} 条记录！`);
                } else {
                    alert('未找到可导入的数据，请检查Excel文件格式！');
                }
                
                // 清空文件输入
                e.target.value = '';
            };
            
            reader.readAsArrayBuffer(file);
        });
        
        // 格式化日期
        function formatDate(date) {
            if(date instanceof Date) {
                return date.toISOString().split('T')[0];
            }
            
            if(typeof date === 'string') {
                // 尝试解析各种日期格式
                const parsed = new Date(date);
                if(!isNaN(parsed)) {
                    return parsed.toISOString().split('T')[0];
                }
            }
            
            // 默认返回今天
            return new Date().toISOString().split('T')[0];
        }
        
        // 更改图表类型
        function changeChartType(type) {
            currentChartType = type;
            
            // 更新按钮状态
            document.querySelectorAll('.chart-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            updateCharts();
        }
        
        // 更新图表
        function updateCharts() {
            updateBarChart();
            updatePieChart();
        }
        
        // 更新柱状图
        function updateBarChart() {
            const ctx = document.getElementById('barChart').getContext('2d');
            
            // 销毁旧图表
            if(barChart) {
                barChart.destroy();
            }
            
            // 根据当前图表类型准备数据
            let labels = [];
            let incomeData = [];
            let expenseData = [];
            
            const currentDate = new Date();
            const currentYear = currentDate.getFullYear();
            
            if(currentChartType === 'year') {
                // 年度图表 - 显示过去12个月
                for(let i = 11; i >= 0; i--) {
                    const date = new Date(currentYear, currentDate.getMonth() - i, 1);
                    labels.push(`${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}`);
                    
                    const monthStart = new Date(date.getFullYear(), date.getMonth(), 1);
                    const monthEnd = new Date(date.getFullYear(), date.getMonth() + 1, 0);
                    
                    let monthIncome = 0;
                    let monthExpense = 0;
                    
                    records.forEach(record => {
                        const recordDate = new Date(record.date);
                        if(recordDate >= monthStart && recordDate <= monthEnd) {
                            if(record.type === 'income') {
                                monthIncome += record.amount;
                            } else {
                                monthExpense += record.amount;
                            }
                        }
                    });
                    
                    incomeData.push(monthIncome);
                    expenseData.push(monthExpense);
                }
            } else if(currentChartType === 'month') {
                // 月度图表 - 显示当前月每天的数据
                const currentMonth = currentDate.getMonth();
                const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                
                for(let i = 1; i <= daysInMonth; i++) {
                    labels.push(i.toString());
                    
                    const day = new Date(currentYear, currentMonth, i);
                    const nextDay = new Date(currentYear, currentMonth, i + 1);
                    
                    let dayIncome = 0;
                    let dayExpense = 0;
                    
                    records.forEach(record => {
                        const recordDate = new Date(record.date);
                        if(recordDate >= day && recordDate < nextDay) {
                            if(record.type === 'income') {
                                dayIncome += record.amount;
                            } else {
                                dayExpense += record.amount;
                            }
                        }
                    });
                    
                    incomeData.push(dayIncome);
                    expenseData.push(dayExpense);
                }
            } else if(currentChartType === 'week') {
                // 周度图表 - 显示过去8周
                for(let i = 7; i >= 0; i--) {
                    const weekEnd = new Date();
                    weekEnd.setDate(weekEnd.getDate() - i * 7);
                    const weekStart = new Date(weekEnd);
                    weekStart.setDate(weekStart.getDate() - 6);
                    
                    labels.push(`第${getWeekNumber(weekStart)}周`);
                    
                    let weekIncome = 0;
                    let weekExpense = 0;
                    
                    records.forEach(record => {
                        const recordDate = new Date(record.date);
                        if(recordDate >= weekStart && recordDate <= weekEnd) {
                            if(record.type === 'income') {
                                weekIncome += record.amount;
                            } else {
                                weekExpense += record.amount;
                            }
                        }
                    });
                    
                    incomeData.push(weekIncome);
                    expenseData.push(weekExpense);
                }
            }
            
            // 创建新图表
            barChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '收入',
                            data: incomeData,
                            backgroundColor: 'rgba(46, 204, 113, 0.7)',
                            borderColor: 'rgba(46, 204, 113, 1)',
                            borderWidth: 1
                        },
                        {
                            label: '支出',
                            data: expenseData,
                            backgroundColor: 'rgba(231, 76, 60, 0.7)',
                            borderColor: 'rgba(231, 76, 60, 1)',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '¥' + value;
                                }
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ¥' + context.parsed.y.toFixed(2);
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // 更新饼图
        function updatePieChart() {
            const ctx = document.getElementById('pieChart').getContext('2d');
            
            // 销毁旧图表
            if(pieChart) {
                pieChart.destroy();
            }
            
            // 统计支出类别
            const categoryMap = {};
            records.forEach(record => {
                if(record.type === 'expense') {
                    categoryMap[record.content] = (categoryMap[record.content] || 0) + record.amount;
                }
            });
            
            // 转换为图表数据
            const categories = Object.keys(categoryMap);
            const amounts = Object.values(categoryMap);
            
            // 如果数据为空，显示提示
            if(categories.length === 0) {
                // 创建无数据的图表
                pieChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['暂无数据'],
                        datasets: [{
                            data: [1],
                            backgroundColor: ['#e2e8f0']
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                enabled: false
                            }
                        }
                    }
                });
                
                // 在画布上显示文本
                const chartContainer = ctx.canvas.parentNode;
                const noDataText = document.createElement('div');
                noDataText.textContent = '暂无支出数据';
                noDataText.style.textAlign = 'center';
                noDataText.style.paddingTop = '100px';
                noDataText.style.color = '#718096';
                
                // 移除旧的提示文本
                const oldText = chartContainer.querySelector('.no-data-text');
                if(oldText) oldText.remove();
                
                noDataText.className = 'no-data-text';
                chartContainer.appendChild(noDataText);
                
                return;
            }
            
            // 移除旧的提示文本
            const chartContainer = ctx.canvas.parentNode;
            const oldText = chartContainer.querySelector('.no-data-text');
            if(oldText) oldText.remove();
            
            // 生成颜色
            const colors = generateColors(categories.length);
            
            // 创建饼图
            pieChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: categories,
                    datasets: [{
                        data: amounts,
                        backgroundColor: colors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                padding: 20,
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.raw || 0;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = Math.round((value / total) * 100);
                                    return `${label}: ¥${value.toFixed(2)} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // 生成颜色数组
        function generateColors(count) {
            const colors = [
                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF',
                '#FF9F40', '#FF6384', '#C9CBCF', '#4BC0C0', '#FFCE56',
                '#2ECC71', '#E74C3C', '#3498DB', '#9B59B6', '#1ABC9C',
                '#F39C12', '#D35400', '#C0392B', '#7F8C8D', '#2C3E50'
            ];
            
            // 如果需要的颜色比预设的多，生成随机颜色
            if(count <= colors.length) {
                return colors.slice(0, count);
            }
            
            const result = colors.slice();
            for(let i = colors.length; i < count; i++) {
                result.push('#' + Math.floor(Math.random()*16777215).toString(16));
            }
            
            return result;
        }
        
        // 获取周数
        function getWeekNumber(date) {
            const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        }
        
        // GitHub存储功能
        // 注意：实际部署时需要配置GitHub Token和仓库信息
        let githubConfig = {
            token: '', // 需要用户自己配置
            repo: 'yourusername/expense-tracker-data', // 数据仓库
            branch: 'main'
        };
        
        // 保存到GitHub
        async function saveToGitHub() {
            // 检查是否配置了GitHub Token
            if(!githubConfig.token || !githubConfig.repo || githubConfig.repo === 'yourusername/expense-tracker-data') {
                return; // 未配置，跳过GitHub同步
            }
            
            try {
                const data = {
                    records: records,
                    contentHistory: contentHistory,
                    lastUpdated: new Date().toISOString()
                };
                
                const response = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/data.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubConfig.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: '更新消费记录数据',
                        content: btoa(JSON.stringify(data, null, 2)),
                        sha: localStorage.getItem('githubDataSha') || null,
                        branch: githubConfig.branch
                    })
                });
                
                if(response.ok) {
                    const result = await response.json();
                    localStorage.setItem('githubDataSha', result.content.sha);
                    console.log('数据已保存到GitHub');
                }
            } catch(error) {
                console.error('保存到GitHub失败:', error);
            }
        }
        
        // 从GitHub加载数据
        async function loadFromGitHub() {
            // 检查是否配置了GitHub
            if(!githubConfig.token || !githubConfig.repo || githubConfig.repo === 'yourusername/expense-tracker-data') {
                return;
            }
            
            try {
                const response = await fetch(`https://api.github.com/repos/${githubConfig.repo}/contents/data.json`, {
                    headers: {
                        'Authorization': `token ${githubConfig.token}`
                    }
                });
                
                if(response.ok) {
                    const result = await response.json();
                    const data = JSON.parse(atob(result.content));
                    
                    records = data.records || [];
                    contentHistory = data.contentHistory || [];
                    localStorage.setItem('githubDataSha', result.sha);
                    
                    // 更新界面
                    updateSummary();
                    renderTable();
                    updateCharts();
                    console.log('从GitHub加载数据成功');
                }
            } catch(error) {
                console.error('从GitHub加载数据失败:', error);
            }
        }
        
        // 配置GitHub同步（用户需要手动调用此函数）
        function configureGitHub() {
            const token = prompt('请输入GitHub Personal Access Token:');
            const repo = prompt('请输入数据仓库（格式：用户名/仓库名）:', 'yourusername/expense-tracker-data');
            
            if(token && repo) {
                githubConfig.token = token;
                githubConfig.repo = repo;
                localStorage.setItem('githubConfig', JSON.stringify(githubConfig));
                alert('GitHub配置已保存！数据将自动同步。');
                saveToGitHub();
            }
        }
        
        // 加载GitHub配置
        const savedConfig = localStorage.getItem('githubConfig');
        if(savedConfig) {
            githubConfig = JSON.parse(savedConfig);
        }
    </script>
